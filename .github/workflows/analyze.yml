name: Analyze Posts

on:
  workflow_run:
    workflows: ["Transcribe Videos"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyze
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # free: get it from Google AI Studio
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: if set, Claude is used first
          NICHE: ${{ vars.NICHE }}
        run: python analyze_posts.py
      # "My Script": rewrites new posts into a voiceover script in my voice, using brand_voice.md.
      # This is a bonus step; if it fails (e.g. quota used up) it must not block the dashboard build, hence continue-on-error.
      - name: Rewrite to my voice (new posts only)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NICHE: ${{ vars.NICHE }}
        run: python rewrite_posts.py
