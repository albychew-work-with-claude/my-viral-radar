name: Rewrite To My Voice

# Manually re-run "My Script". Not needed normally: the weekly Analyze Posts run fills in new posts.
# When to use it: after editing brand_voice.md (new voice/persona), to redo every script already generated.
on:
  workflow_dispatch:
    inputs:
      rewrite_all:
        description: "Edited brand_voice.md and want to redo all scripts? Enter 1 (leave blank = only new posts without a script)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rewrite
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # free: get it from Google AI Studio
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: if set, Claude is used first
          NICHE: ${{ vars.NICHE }}
          REWRITE_ALL: ${{ inputs.rewrite_all }}
        run: python rewrite_posts.py
