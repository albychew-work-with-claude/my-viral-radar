<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>my-viral-radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d13;
    --card: #11151d;
    --card-hi: #151a24;
    --border: #1d2430;
    --border-hi: #2c3546;
    --text: #e8ecf3;
    --muted: #8a94a6;
    --faint: #5b6577;
    --accent: #5ea1ff;
    --green: #3fd68f;
    --orange: #f0a33f;
    --pink: #ff6b9d;
    --red: #ff5c5c;
    --fire1: #ff8a3d;
    --fire2: #ff4d6d;
    --font: 'Inter', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --disp: 'Space Grotesk', 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #232c3b var(--bg); }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(94,161,255,.3); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #232c3b; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #2c3546; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .ic { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }

  header { position: sticky; top: 0; z-index: 50; background: rgba(10,13,19,.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 13px 20px 12px; }
  .hrow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; max-width: 1440px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--fire1), var(--fire2));
    box-shadow: 0 4px 16px rgba(255,92,80,.35); }
  .mark .ic { width: 17px; height: 17px; color: #fff; }
  h1 { font-family: var(--disp); font-size: 16.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; line-height: 1.15; }
  h1 small { display: block; color: var(--faint); font-family: var(--font); font-weight: 400;
    font-size: 10.5px; letter-spacing: 0; }

  .search { position: relative; }
  .search > .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--faint); width: 13.5px; pointer-events: none; }
  input#fSearch { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px 8px 32px; font-size: 13px; font-family: var(--font);
    width: 200px; transition: border-color .18s, background .18s; }
  input#fSearch:hover { border-color: var(--border-hi); }
  input#fSearch:focus { border-color: var(--accent); outline: none; }
  input#fSearch::placeholder { color: var(--faint); }

  select, .btn { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s, color .18s;
    display: inline-flex; align-items: center; gap: 6px; }
  select:hover, .btn:hover { border-color: var(--border-hi); background: var(--card-hi); }
  .btn:active { transform: scale(.97); }
  .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(94,161,255,.08); }

  .tabs { display: flex; gap: 7px; flex-wrap: wrap; max-width: 1440px; margin: 12px auto 0; }
  .tab { display: inline-flex; align-items: center; gap: 7px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 6.5px 14px;
    font-size: 13px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, background .18s, color .18s, transform .18s; }
  .tab:hover { border-color: var(--border-hi); color: var(--text); }
  .tab .cnt { font-family: var(--disp); font-weight: 600; font-size: 11px;
    background: rgba(255,255,255,.06); padding: 1.5px 7.5px; border-radius: 99px;
    font-variant-numeric: tabular-nums; }
  .tab.on { color: var(--text);
    background: linear-gradient(135deg, rgba(255,138,61,.15), rgba(255,77,109,.15));
    border-color: rgba(255,120,90,.45); }
  .tab.on .cnt { background: rgba(255,120,90,.25); }
  body.dragging .tab.droppable { border-style: dashed; border-color: var(--accent); }
  .tab.over { background: rgba(94,161,255,.22); color: var(--text); transform: scale(1.07); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1440px; margin: 9px auto 0; align-items: center; }
  .chips .lbl { font-size: 12px; color: var(--faint); margin-right: 2px; }
  .chip2 { display: inline-flex; align-items: center; gap: 5.5px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 4.5px 12px;
    font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, color .18s, background .18s;
    font-variant-numeric: tabular-nums; }
  .chip2 .ic { width: 12.5px; height: 12.5px; }
  .chip2:hover { border-color: var(--border-hi); color: var(--text); }
  .chip2.on { border-color: rgba(240,163,63,.6); color: var(--orange); background: rgba(240,163,63,.08); }

  main { max-width: 1440px; margin: 22px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(305px, 1fr)); gap: 18px; }

  .card { position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    transition: transform .22s cubic-bezier(.2,.7,.3,1), border-color .22s, box-shadow .22s;
    animation: fadeUp .45s cubic-bezier(.2,.7,.3,1) both; }
  .card:hover { transform: translateY(-3px); border-color: var(--border-hi);
    box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .card.outlier::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--fire1), var(--fire2)); z-index: 2; }
  .card[draggable] { cursor: grab; }
  .card.lifting { opacity: .45; }
  .card.saved { border-color: var(--green); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .embed { position: relative; width: 100%; aspect-ratio: 4/5; background: #080b10; }
  .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .embed .ph { position: absolute; inset: 0; display: grid; place-items: center;
    background: linear-gradient(110deg, #0b0e15 8%, #121826 18%, #0b0e15 33%);
    background-size: 200% 100%; animation: shimmer 1.5s linear infinite; }
  .embed .ph .ic { width: 30px; height: 30px; color: #2a3342; stroke-width: 1.6; }
  @keyframes shimmer { to { background-position-x: -200%; } }

  .meta { padding: 13px 15px 14px; display: flex; flex-direction: column; gap: 9px; }
  .row1 { display: flex; align-items: center; gap: 7px; font-size: 13px; flex-wrap: wrap; }
  .handle { color: #3a4456; cursor: grab; display: inline-flex; }
  .handle .ic { width: 13px; height: 13px; }
  .who { font-weight: 600; color: var(--accent); text-decoration: none; }
  .who:hover { text-decoration: underline; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 500;
    padding: 2.5px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge .ic { width: 10.5px; height: 10.5px; }
  .badge.bnew { color: var(--pink); border-color: rgba(255,107,157,.45); background: rgba(255,107,157,.07); }
  .badge.bhorse { color: var(--orange); border-color: rgba(240,163,63,.45); background: rgba(240,163,63,.07); }
  .badge.bbait { color: var(--accent); border-color: rgba(94,161,255,.4); background: rgba(94,161,255,.07); }
  .date { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }

  .nums { display: flex; gap: 6px; flex-wrap: wrap; }
  .num { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    border: 1px solid var(--border); border-radius: 9px; padding: 5px 9px;
    font-size: 11px; color: var(--muted); }
  .num .ic { width: 11.5px; height: 11.5px; }
  .num b { font-family: var(--disp); color: var(--text); font-size: 12.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .num.hot { border-color: rgba(255,122,77,.35); }
  .num.hot .ic, .num.hot b { color: #ff7a4d; }
  .num.x { border-color: rgba(240,163,63,.35); }
  .num.x .ic, .num.x b { color: var(--orange); }
  .num.er .ic, .num.er b { color: var(--green); }

  .cap { color: var(--muted); font-size: 12.5px; line-height: 1.55; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .cap.open { -webkit-line-clamp: unset; }
  .cap b { color: var(--text); font-weight: 600; }
  .ai { border-left: 2px solid var(--orange); background: rgba(240,163,63,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); }
  .ai b { color: var(--orange); font-weight: 600; }
  .mine { border-left: 2px solid var(--green); background: rgba(63,214,143,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); cursor: pointer; display: -webkit-box; -webkit-line-clamp: 4;
    -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .mine.open { -webkit-line-clamp: unset; }
  .mine b { color: var(--green); font-weight: 600; }

  .srow { display: flex; align-items: center; gap: 7px; }
  .srow label { font-size: 12px; color: var(--faint); }
  .status { flex: 1; padding: 6px 9px; font-size: 12.5px; }
  .status.sNew { color: var(--muted); }
  .status.sFilming { color: var(--orange); border-color: rgba(240,163,63,.5); }
  .status.sDone { color: var(--green); border-color: rgba(63,214,143,.5); }
  .status.sSkipped { color: var(--red); border-color: rgba(255,92,92,.5); }
  .abtn { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    color: var(--muted); border: 1px solid var(--border); border-radius: 9px;
    padding: 6px 10px; font-size: 11.5px; font-family: var(--font); cursor: pointer;
    text-decoration: none; transition: color .18s, border-color .18s, transform .1s; }
  .abtn .ic { width: 12px; height: 12px; }
  .abtn:hover { color: var(--accent); border-color: rgba(94,161,255,.5); }
  .abtn:active { transform: scale(.95); }

  .more { text-align: center; margin: 28px 0 44px; }
  .more button { background: var(--card); color: var(--accent); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 30px; font-size: 14px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s; }
  .more button:hover { border-color: var(--border-hi); background: var(--card-hi); }

  .empty { color: var(--faint); text-align: center; padding: 70px 0; display: flex;
    flex-direction: column; align-items: center; gap: 12px; font-size: 14px; }
  .empty .ic { width: 34px; height: 34px; stroke-width: 1.5; color: #2c3546; }

  footer { color: var(--faint); font-size: 11px; text-align: center; padding: 22px; }

  #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--card-hi); border: 1px solid var(--border-hi); border-radius: 11px;
    padding: 11px 20px; font-size: 13px; display: none; z-index: 99; opacity: 0;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); transition: opacity .2s, transform .2s; }
  #toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></symbol>

  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></symbol>

  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>

  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></symbol>
</svg>
<header>
  <div class="hrow">
    <div class="brand">
      <div class="mark"><svg class="ic"><use href="#i-flame"/></svg></div>
      <h1>my-viral-radar<small id="updated"></small></h1>
    </div>
    <div class="search"><svg class="ic"><use href="#i-search"/></svg>
      <input id="fSearch" placeholder="Search caption / hashtag / account"></div>
    <select id="fTracker"><option value="">All Trackers</option></select>
    <select id="fComp"><option value="">All Competitors</option></select>
    <select id="fSort">
      <option value="x">Sort: Viral multiple (vs own average)</option>
      <option value="score">Sort: Viral Score</option>
      <option value="er">Sort: Engagement Rate</option>
      <option value="comments">Sort: Comments</option>
      <option value="likes">Sort: Likes</option>
      <option value="date">Sort: Newest</option>
    </select>
    <button class="btn" id="fVideo"><svg class="ic"><use href="#i-video"/></svg>Videos only</button>

    <a class="btn" href="team.html" target="_top" title="Workspace"><svg class="ic"><use href="#i-users"/></svg>Workspace</a>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="presets"></div>
  <div class="chips" id="trends"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"><svg class="ic"><use href="#i-search"/></svg>No posts match these filters</div>
  <div class="more" id="moreWrap" style="display:none"><button id="moreBtn">Load more</button></div>
</main>

rast how CPF payouts fall short of lifestyle inflation in Singapore, urging clients to build private retirement funds now.", "my": "Am I right to say that when a financial plan matures in your forties, you start wondering what to do with the funds next?\n\nMost people think the main goal of investing those funds is simply to chase the highest returns available in the market right now.\n\nActually, it is not just about chasing returns; it is about making sure those funds support your future retirement lifestyle without depending on anyone else.\n\nLet us look at how you can plan for this properly.\n\nFirst, identify your core objective. Ask yourself whether your funds are still meant for wealth accumulation or if you are preparing to draw down from them soon.\n\nSecond, work out your numbers. What will be your ideal or minimum monthly income you wish to achieve at the end of your accumulation phase?\n\nThird, structure your timeline. Map out a clear horizon, such as building your retirement portfolio over a twelve to twenty-four month timeframe so your strategy matches your life stage.\n\nSome people leave their maturing funds idle without a clear plan, which makes it harder to map out their future income. With a structured approach, you get a clear view of how your funds can work towards your retirement objectives over time.\n\nIf your plan is maturing soon and you want to look at your options, send me a message so we can talk through your core objective and your ideal or minimum monthly income target.\n\nSure... Or maybe if you don't mind, can let me know what you want to think about?\n\nThis post is for general information only and does not constitute financial advice or a recommendation to purchase any product. It does not take into account your specific investment objectives, financial situation or needs. Please seek advice from a qualified financial adviser before making any decision.", "tags": "sginstagram, sg, passiveincome, sginsurance, singapore", "bait": false, "type": "Video", "likes": 1018, "comments": 27, "er": 4.98, "followers": 20964, "date": "2026-10-28", "url": "https://www.instagram.com/p/DfCTtkTzPyS/", "video": true, "ratio": 0, "score": 5.24, "status": "New", "x": 1.9}, {"id": "DeMQybvjCmH", "tracker": "my-viral-radar Competitors", "competitor": "sissigohlegacyplanner", "caption": "Good advice starts with what is useful to the person in front of you.\n\nIn this workshop story, Sissi reflects on a conversation where the immediate focus was not securing a sale. The value was in giving an honest response and allowing the relationship to develop naturally.\n\nA useful planning conversation should leave you with greater understanding of your situation and the questions that matter. It should also leave room to think, rather than pressure you into a decision.\n\nSave this reminder for your next adviser conversation.\n\n#LegacyPlanning #FinancialAdvice #ClientTrust", "transcript": "And then he was a new client that I never met before, and then he came to do trust business. And then he told me he flew in to meet a few private bankers and trustees and all that. And then he came and then I basically only answered him the questions and what I think can be done and what cannot. So I didn't expect an answer or a reply from him later on. But he called me the same day and he said that can we meet again? Because I met a few bankers and I think you make the most sense. So I said okay, sure. So we met again. And then he actually kind of made a joke. He said that everybody who met me, they would dress up nicely, they would bring me to dinner, lunch or whatever. And you basically only came down in sleepers and gave me free coffee. You didn't do anything special. I said yeah, because my work is to give you good advice, right? So that's how we became friends. He just trusted me with his business. So I actually gave him the advice that he needed. And he felt very comfortable sharing his stories with me. Thank you.", "brk": "Hook type: showing results\nStructure: Client approaches for transaction → Advisor gives honest, no-pressure advice → Client returns and trusts advisor over lavish competitors\nWhy it works: It builds instant credibility by demonstrating that authenticity and genuine expertise outperform pushy sales tactics and superficial perks.\nAdaptation angle: Share a story where refusing to hard-sell a Singaporean client on a high-commission product ultimately won their long-term wealth management business.", "my": "Ok, understand your core objective. You have a plan maturing, and your first thought is simply, what's good in the market for now?\n\nMost people think finding the right direction means listening to fancy pitches and fancy dinners from advisers trying to sell you something on day one.\n\nActually, it is not about that at all. The real value is simply getting honest answers about what can be done and what cannot.\n\nLet me walk you through how we usually start when you reach out.\n\nFirst, we look at where you currently stand. Am I right to say for the next 12 to 24 months, it is still under your wealth accumulation phase?\n\nSecond, we clarify your timeline together. Meaning you won't be drawing down the dividends in this period.\n\nThird, we get clear on your target numbers. Also, to help me in proposing, what will be your ideal or minimum monthly income you wish to achieve at the end of 24 months?\n\nBefore we met, many clients used to feel pressured to jump into whatever product was trending in the market right away. With the right approach, conversations are calm, objective, and entirely focused on what matters to your future.\n\nIf you are ready to talk through your core objective and your ideal or minimum monthly income target, send me a message.\n\nSure, or maybe if you don't mind, can let me know what you want to think about?\n\nThis post is for general information only and does not constitute financial advice or a recommendation to purchase any product. It does not take into account your specific investment objectives, financial situation or needs. Please seek advice from a qualified financial adviser before making any decision.", "tags": "LegacyPlanning, FinancialAdvice, ClientTrust", "bait": false, "type": "Video", "likes": 10, "comments": 0, "er": 5.13, "followers": 195, "date": "2026-10-07", "url": "https://www.instagram.com/p/DeMQybvjCmH/", "video": true, "ratio": 0, "score": 5.13, "status": "New", "x": 1.3}, {"id": "DfV6G6BDtIN", "tracker": "my-viral-radar Competitors", "competitor": "sissigohlegacyplanner", "caption": "A client initially approached me because he wanted someone genuinely professional to manage his family’s wealth.\n\nIronically, by the end of our discussions, a family member asked me to match a rebate that another advisor from another firm offered.\n\nI declined, for two reasons.\n\nFirst, I am in this business for the long term. Every client comes with a responsibility, and I would never sacrifice the professional reputation I have spent years building just to close a case.\n\nSecond, I believe in fairness and in treating every client with the same level of integrity and commitment.\n\nThere is something worth reflecting on:\n\nWhy should those who spend the most time negotiating end up with better terms than those who trust me from the outset?\n\nShould those who place their trust in me be the ones who end up at a disadvantage?\n\nI don’t believe in doing business that way.\n\nTo me, professionalism goes beyond investment advice and executing transactions. It is about integrity, fairness and respecti", "transcript": "And then along the years, I also built my business in the mindset that I'm a business owner. I need a sustainable business. I'm not just an advisor. So a few years ago, a Harvard alum came to me and he wanted someone very professional to manage his money. He was going to have a newborn and his father-in-law actually set aside a sum of money for the newborn. And I did analysis that came up with the plan. And then came another advisor who told him that if you buy the same thing from me, I will give you 8,000 rebates. The commission was supposed to be 9,000. So the client came back and said, Cici, we all like you. I think you're very professional. Will someone else offer me this? Would you match it? It's quite ironic because the very person who wanted someone who is professional tested me immediately on my professionalism by asking for a rebate. I said no for two reasons. Number one, I'm here for a long term. It's not the short-term business that I can just sell something and go and leave the industry. And every client comes with responsibility. So I need to survive without compromising my economic value in order to serve my clients. And number two is fairness. Why should someone who negotiates hardest get a better deal than those people who simply trust me? That didn't sound right to me. So I said no, I'm not going to match it. Well, then he said then I will go with another advisor, but I will come back for other advice. And I said no. That's the end of the business relationship because trust is broken. What happened a few years later is that this client actually went into business and apparently he needed funding. So we have the same circle of friends and some investors actually came to ask me, well, Sissy, do you know this person? How is he? And I told them honestly what happened. I didn't say this to embarrass him. I say this because that's what reputation means. We don't get to choose how our reputation shows up. One day we built in one room and the other day it walked into another room without us.", "brk": "Hook type: Counter-intuitive\nStructure: Setup client dilemma → Refusal of rebate → Long-term consequence\nWhy it works: It establishes strong personal integrity and boundaries, filtering for high-value clients who respect professional ethics over fee-cutting.\nAdaptation angle: Share a story of saying no to a high-net-worth prospect demanding risky CPF optimization, emphasising why protecting your CPF-SA savings in Singapore matters more than closing a sale.", "my": "I approached you because I remembered you're in the same industry, and now my plan is maturing. What should I do next?\n\nMost people think that when a plan matures, the only thing that matters is chasing the highest number on the market right now.\n\nActually, it is not just about grabbing whatever looks good today without checking your broader timeline.\n\nLet us look at how we can approach this step by step.\n\nFirst, let us confirm your timeline.\nAm I right to say for the next 12 to 24 months, it is still under your wealth accumulation phase?\nMeaning you will not be drawing down the dividends in this period.\n\nSecond, let us look at your core objective.\nOk, understand your core objective.\nWe want to map out what you want to achieve over this timeframe rather than rushing into any decisions.\n\nThird, let us pin down your target number.\nAlso, to help me in proposing, what will be your ideal or minimum monthly income you wish to achieve at the end of 24 months?\nThis keeps our focus entirely on what you actually need for your retirement.\n\nClients used to jump at whatever new offer appeared the moment their funds freed up, only to find the structure did not match their long-term goals.\nWith a proper discovery process, we focus purely on your personal objectives and your income targets instead of market noise.\n\nIf you are currently reviewing your options as a plan matures, send me a message so we can talk through your core objective and your ideal or minimum monthly income target.\nSure, or maybe if you don't mind, can let me know what you want to think about?\n\nThis post is for general information only and does not constitute financial advice or a recommendation to purchase any product. It does not take into account your specific investment objectives, financial situation or needs. Please seek advice from a qualified financial adviser before making any decision.", "tags": "", "bait": false, "type": "Video", "likes": 8, "comments": 0, "er": 4.1, "followers": 195, "date": "2026-11-05", "url": "https://www.instagram.com/p/DfV6G6BDtIN/", "video": true, "ratio": 0, "score": 4.1, "status": "New", "x": 1.0}, {"id": "DfQvWyDGbu8", "tracker": "my-viral-radar Competitors", "competitor": "sissigohlegacyplanner", "caption": "I was chatting with a friend from the crypto world about wealth succession, and our conversation turned out to be quite amusing.\n\nI asked him, “If I want to pass my cryptocurrency on to my children securely, how should I go about it?”\n\nHe replied, “It’s simple! People in the crypto world can crack passwords. You can just transfer the coins from your account directly to your children’s accounts. There’s no regulation, no probate process, and it can all be done in a second!”\n\nI paused and asked, “If it’s really that easy, why not just transfer the coins from my account directly into their own account? Why bother transferring them to my children?”\n\nHe was momentarily stumped.\n\nSo I followed up with another question: “How would my children prove that they are legally entitled to inherit those assets?”\n\nTransferring assets is a technical matter. Ensuring they are passed on lawfully, with proper documentation and a clear legal basis, is what wealth succession is really about.\n\nBlockchain can", "transcript": "Apparently this guy had a lot of cryptos right and then he said you know crypto is the future of the world right And I say as a legacy planner, I'm just I just have one question right If let's say in the future I have kids right how how do I make sure that my kids can inherit them right? So I say like how how am I kids going to know that I have cryptos right and he said you know You just need to ask them to find three people to decipher the code So basically you piece the information together. I don't know how it works. Basically you get three people I think oh so that means everybody in crypto knows how to decipher the code and he said yes Right, this is how it works. Then I said oh, okay, and then he said You know your assets can just be transferred to your kids like that He literally did that like can we transfer like that? Okay, so then I say okay so I need my kids to go find three people to decipher the code and These three people after deciding to deciphering the code right they can just transfer my assets to that account like that Why why do they need to give to my kids right? He's like he went silent So I think the first thing people need to figure out is like Can your kids really inherit what you have and where do they find them right? So", "brk": "Hook type: Conversational anecdote / direct pain point\nStructure: Dialogue setup with crypto friend → Exposing security flaw in informal transfers → Punchline about legal inheritance rights\nWhy it works: It leverages a trendy, high-stakes topic (crypto) to expose a blind spot in informal wealth transfer.\nAdaptation angle: Contrast the tech-heavy method of passing down overseas stock portfolios with Singapore's actual legal probate and LPA requirements.", "my": "I was chatting with a friend about wealth succession recently, and our conversation turned out to be quite interesting.\n\nHe told me about moving everything into complex, speculative assets because he thought it was the easiest way to grow a fortune for the future.\n\nAnd I say as a financial consultant, I just have one question. If let's say your plan is maturing, how do your children actually know how to inherit those funds smoothly?\n\nHe replied that it is simple, because everything can just be shifted around in seconds without any proper structure.\n\nI paused and asked him a simple question. If it is really that straightforward, what stops those funds from going to the wrong hands instead of your family?\n\nHe was momentarily stumped.\n\nSo I think the first thing people need to figure out is whether your family can really inherit what you have built without any confusion.\n\nLet's look at how we can approach this properly together.\n\nFirst, let us look at your core objective. Am I right to say for the next 12 to 24 months, it is still under your wealth accumulation phase?\n\nSecond, let us clarify your timeline. Meaning you won't be drawing down the dividends in this period.\n\nThird, to help me in proposing, what will be your ideal or minimum monthly income you wish to achieve at the end of 24 months?\n\nMany people used to handle their maturing plans by guessing what is good in the market for now, often leaving their legacy exposed to uncertainty.\n\nWith the right approach, you can map out your accumulation phase and retirement goals clearly before making any moves.\n\nSure. Or maybe if you don't mind, can let me know what you want to think about?\n\nSend me a message to talk through your core objective and your ideal or minimum monthly income target.\n\nThis post is for general information only and does not constitute financial advice or a recommendation to purchase any product. It does not take into account your specific investment objectives, financial situation or needs. Please seek advice from a qualified financial adviser before making any decision.", "tags": "", "bait": false, "type": "Video", "likes": 8, "comments": 0, "er": 4.1, "followers": 195, "date": "2026-11-03", "url": "https://www.instagram.com/p/DfQvWyDGbu8/", "video": true, "ratio": 0, "score": 4.1, "status": "New", "x": 1.0}, {"id": "DeUJx6cB2qz", "tracker": "my-viral-radar Competitors", "competitor": "olivia_liwenjun", "caption": "新加坡退休的基石 # CPF ，到底是应该65岁开始拿钱还是75岁开始拿钱？ 等多10年的好处以及付出的代价到底值吗？ 今天帮您解析 （当然这仅仅是我的个人观点，仅供大家参考，也欢迎大家把自己的想法告诉我。） #sginstagram #sg #passiveincome #sginsurance", "transcript": "CBF Life到底从65岁开始还是等到70岁再拿很多人可能会跟你说一定要等没等一年你在Monster Income就会高一些我举个例子比如说一个65岁的男性他选择Standard Plan如果他从65岁开始拿的话他一个月就可以拿1750新币如果他等到70岁再开始拿的话那他每个月的Income大概是2370新币一个月多了650新币看起来是不错感觉加薪了但是我今天要提醒你就是很多人他路算了一笔账为了  \n\nActive in this industry more than eight years, providing one stop financial solutions, specialises in Retirement, Creating Passive Income, Legacy Planning, I always guide my clients through three simple steps to look at the bigger picture. \n\nFirst, let us look at your current life stage. Am I right to say for the next 12 to 24 months, it is still under your wealth accumulation phase? \n\nSecond, let us look at your timeline. Meaning you won't be drawing down the dividends in this period if you already have other active sources of income. \n\nThird, let us look at your cash flow flexibility. Also, to help me in proposing, what will be your ideal or minimum monthly income you wish to achieve at the end of 24 months? \n\nRetirement planning is not just about asking how much you can get in the future. \n\nIt is also about knowing when you need to use the money, how much liquidity you have along the way, and whether you are keeping enough assets under your own control today. \n\nIf you are currently facing a maturing plan and wondering what to do next, let us sit down and work out your core objective together. \n\nSure... Or maybe if you don't mind, can let me know what you want to think about? \n\nSend me a message, and let us talk through your ideal or minimum monthly income target. \n\nThis post is for general information only and does not constitute financial advice or a recommendation to purchase any product. It does not take into account your specific investment objectives, financial situation or needs. Please seek advice from a qualified financial adviser before making any decision.", "tags": "sginstagram, sg, passiveincome, sginsurance", "bait": false, "type": "Video", "likes": 666, "comments": 38, "er": 3.36, "followers": 20964, "date": "2026-10-10", "url": "https://www.instagram.com/p/DeUJx6cB2qz/", "video": true, "ratio": 0, "score": 3.72, "status": "New", "x": 1.4}, {"id": "DeRStLOBxH4", "tracker": "my-viral-radar Competitors", "competitor": "olivia_li eant for tomorrow, giving you clear boundaries for your savings.\n\nSecond, let us look at your income targets. Also, to help me in proposing, what will be your ideal or minimum monthly income you wish to achieve at the end of 24 months?\n\nWriting down this specific number stops you from guessing and gives your wealth accumulation a concrete destination to aim for.\n\nThird, let us factor in your broader milestones. We look at how your retirement and legacy planning objectives fit together so your wealth serves you across every chapter.\n\nClients used to let maturing funds sit idle in basic accounts without a clear plan, leaving them unsure if their money was working hard enough. With a structured approach, every dollar has a defined role in your retirement journey.\n\nIf you are currently reviewing a maturing plan or mapping out your future milestones, send me a message. We can talk through your core objective and your ideal or minimum monthly income target together.\n\nSure. Or maybe if you don't mind, can let me know what you want to think about?\n\nThis post is for general information only and does not constitute financial advice or a recommendation to purchase any product. It does not take into account your specific investment objectives, financial situation or needs. Please seek advice from a qualified financial adviser before making any decision.", "tags": "sginstagram, sg, passiveincome, woman, singapore", "bait": false, "type": "Video", "likes": 599, "comments": 7, "er": 2.89, "followers": 20964, "date": "2026-10-09", "url": "https://www.instagram.com/p/DeRStLOBxH4/", "video": true, "ratio": 0, "score": 2.96, "status": "New", "x": 1.1}, {"id": "Dd1Iz_6hWYw", "tracker": "my-viral-radar Competitors", "competitor": "olivia_liwenjun", "caption": "有智慧的父母会尽早让孩子知道的五句话，比考高分还更加重要，来看看你传递了这些信息给他们了吗？ #sginstagram #sg #passiveincome #sginsurance #sginvestment", "transcript": "如果你有小孩的话你一定要告诉他这5句话最硬的后台是你的个人存款最铁的关系是你的个人能力最大的靠山是你健康的身体最稳的依靠是你强大的内心最长久的好运就是你的品行端正这五样东西比你认谁嫁给谁 u won't be drawing down the dividends in this period.\n\nLet's look at three steps to approach this clearly.\n\nFirst, confirm your core objective and time horizon.\n\nAsk yourself whether you are still in the wealth accumulation phase for the next 12 to 24 months.\n\nThis keeps your focus steady without rushing into unnecessary decisions.\n\nSecond, separate your funds by purpose.\n\nDistinguish between money meant for long-term stability and funds you allocate for higher-return goals.\n\nThis clarity helps you manage different parts of your portfolio with peace of mind.\n\nThird, work out your income targets carefully.\n\nTo help in proposing, what will be your ideal or minimum monthly income you wish to achieve at the end of your accumulation phase?\n\nConnecting your funds to a clear income target makes the planning process much more practical.\n\nOr maybe if you don't mind, can let me know what you want to think about?\n\nSend me a message to talk through your core objective and your ideal or minimum monthly income target.\n\nThis post is for general information only and does not constitute financial advice or a recommendation to purchase any product. It does not take into account your specific investment objectives, financial situation or needs. Please seek advice from a qualified financial adviser before making any decision.", "tags": "sginstagram, sg, passiveincome, sginsurance, singapore", "bait": false, "type": "Video", "likes": 472, "comments": 0, "er": 2.25, "followers": 20964, "date": "2026-10-01", "url": "https://www.instagram.com/p/Dd8tUAdzxVN/", "video": true, "ratio": 0, "score": 2.25, "status": "New", "x": 0.8}, {"id": "De1YVXdB7zi", "tracker": "my-viral-radar Competitors", "competitor": "olivia_liwenjun", "caption": "你的伴侣如果想要买保险的话，你会阻止她吗？ 这个很真实的故事分享给大家，希望每个家庭都有保障，有一份安心。每个妻子，每个妈妈都有足够的保障 #sginstagram #sg #passiveincome #sginsurance #singapore", "transcript": "前兩天我的同事在哭著跟我講了一個事情對我震撼蠻大的什麼事情她的一個最好的朋友去世了把朋友的老公就打給她問我老婆有沒有在你這邊買任何的保險她的回答就是沒有一分都沒有她也跟這個朋友有提過  achieve at the end of twenty-four months?\nThis keeps your entire planning stage focused on what you actually need.\nMany clients used to leave their maturing funds idle without a clear direction, leading to uncertainty about the future.\nWith the right approach, you can map out your passive income goals clearly and move forward with confidence.\nIf you are currently reviewing a maturing plan, send me a message so we can talk through your core objective and your ideal or minimum monthly income target.\nOr maybe if you don't mind, can let me know what you want to think about?\nThis post is for general information only and does not constitute financial advice or a recommendation to purchase any product. It does not take into account your specific investment objectives, financial situation or needs. Please seek advice from a qualified financial adviser before making any decision.", "tags": "sginstagram, sg, passiveincome, sginsurance, singapore", "bait": false, "type": "Video", "likes": 385, "comments": 2, "er": 1.85, "followers": 20964, "date": "2026-10-23", "url": "https://www.instagram.com/p/De1YVXdB7zi/", "video": true, "ratio": 0, "score": 1.87, "status": "New", "x": 0.7}, {"id": "DfRoTBQhte1", "tracker": "my-viral-radar Competitors", "competitor": "olivia_liwenjun", "caption": "一位拿到保险理赔客户的心里话，让我感受颇深，分享给大家，希望每个人都有适合自己的保障，在需要的时候都没有遗憾。 #sginstagram #insurance #sg #sginsurance #singapore", "transcript": "最近有一位客户拿到了保险的礼品他说出了一段话让我印象非常深刻还知道吗他说以前认为傻子才会买保险现在认为真的傻子是以为自己一辈子都用不到保险以前他以为身体有问题的时候才需要考虑保险现在才知道身体有病的时候你连买保险的资格都没有以前他认为医院是救人的现在他才知道医生可以尽力的去救你但是医疗费并不会因为你没有钱而不存在以前他觉得交保费是一种负担现在才知道保险有可能就是你的第二次生命以前总觉得等有钱了再买等有需要了再考虑现在才明白世界上很多事情都可以等待未度风险我会等你以前觉得保费交了这个钱就没有了现在才知道真正可怕的并不是你交了保费没用上而是你要用的时候你才发现你没有任何的保障你发现一切都太晚了得以时之间尽在你的远见和选择当中", "brk": "Hook type: Direct pain point\nStructure: Client quote → Shift in mindset on insurance → Ultimate life lesson\nWhy it works: Uses powerful contrast between pre-claim and post-claim perspectives to dismantle common insurance objections.\nAdaptation  take responsibility for their financial future.", "my": "You know, these days I am noticing something quite interesting when chatting with people about their long-term plans. \n\nSometimes, someone reaches out because their plan is maturing, and they ask what is good in the market for now. But then, every time we discuss the next steps, they hesitate, question everything, and never actually take action. They want clarity, but they are not quite ready to commit time to looking at their own numbers properly. \n\nActually, it is not about finding the right plan straight away. It is about whether you are genuinely ready to plan for your future. \n\nTrue planning takes a bit of focus, and it is most effective when approached in clear, steady stages. \n\nFirst, let us look at your current timeline. Am I right to say for the next 12 to 24 months, it is still under your wealth accumulation phase? This helps us understand where your funds need to sit before any future changes. \n\nSecond, let us clarify your core objective. Meaning you won't be drawing down the dividends in this period. Setting this boundary early keeps your accumulation focused and prevents unnecessary adjustments later. \n\nThird, we work out your specific target number. Also, to help me in proposing, what will be your ideal or minimum monthly income you wish to achieve at the end of 24 months? Getting this exact figure ensures our steps match what you actually need. \n\nClients used to jump between random options every time a plan matured without checking their actual timeline or income target. Now, by focusing on your core objective and your ideal monthly income first, the whole process becomes much clearer and calmer. \n\nIf you are sorting out a maturing plan and want to talk through your numbers, send me a message to share your core objective and your ideal or minimum monthly income target. \n\nOr maybe, if you don't mind, can let me know what you want to think about? \n\nThis post is for general information only and does not constitute financial advice or a recommendation to purchase any product. It does not take into account your specific investment objectives, financial situation or needs. Please seek advice from a qualified financial adviser before making any decision.", "tags": "sginstagram, sg, passiveincome, sginsurance, singapore", "bait": false, "type": "Video", "likes": 299, "comments": 6, "er": 1.45, "followers": 20964, "date": "2026-09-30", "url": "https://www.instagram.com/p/Dd6Q-gnphZE/", "video": true, "ratio": 0, "score": 1.51, "status": "New", "x": 0.6}]</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const SUPA = 'https://elrztgepvhzcwebeaeem.supabase.co';
const ANON = 'sb_publishable_VwEWrMYLnQj-vvVN87-Gcg_cteFc3r5';
const STATUSES = ["New", "Filming", "Done", "Skipped"];
document.getElementById('updated').textContent = 'Updated 2026-11-13 13:37 (GMT+8)';
const PAGE = 48;
let shown = PAGE;
let videoOnly = false;
let curTab = 'All';

const $ = id => document.getElementById(id);
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);
const getKey = () => ANON;  // anon key is baked in — safe, can only change status
const I = n => '<svg class="ic"><use href="#i-' + n + '"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const byRec = {}; DATA.forEach(d => byRec[d.id] = d);
const TRENDS = [["sginstagram", 3], ["sg", 3], ["passiveincome", 3], ["singapore", 3], ["sginsurance", 2]];
DATA.forEach(d => {
  d.days = d.date ? Math.max(0, Math.floor((Date.now() - new Date(d.date + 'T00:00:00')) / 864e5)) : null;
  d.horse = d.followers > 0 && d.followers < 50000 && ((d.x || 0) >= 2 || d.score >= 10);
});
const PRESETS = [
  { k: 'px', icon: 'trend', label: 'True viral ×2+', f: d => (d.x || 0) >= 2 },
  { k: 'pn', icon: 'star', label: 'Last 7 days', f: d => d.days !== null && d.days <= 7 },
  { k: 'ph', icon: 'zap', label: 'Dark horse', f: d => d.horse },
  { k: 'pb', icon: 'magnet', label: 'Comment bait', f: d => d.bait },
];
const presetOn = {};

function toast(msg, ok) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  t.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

// filters
const comps = [...new Set(DATA.map(d => d.competitor))].sort();
comps.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = '@'+c; $('fComp').appendChild(o); });
[...new Set(DATA.map(d => d.tracker))].forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; $('fTracker').appendChild(o); });

function matchQ(d) {
  const q = ($('fSearch').value || '').trim().toLowerCase();
  return !q || (d.caption + ' ' + (d.tags || '') + ' ' + (d.transcript || '') + ' ' + (d.brk || '') + ' ' + d.competitor).toLowerCase().includes(q);
}

function basePool() {
  const t = $('fTracker').value, c = $('fComp').value;
  return DATA.filter(d => (!t || d.tracker === t) && (!c || d.competitor === c) && (!videoOnly || d.video)
    && matchQ(d) && PRESETS.every(p => !presetOn[p.k] || p.f(d)));
}

function filtered() {
  const s = $('fSort').value;
  let arr = basePool().filter(d => curTab === 'All' || d.status === curTab);
  const key = { score:'score', er:'er', comments:'comments', likes:'likes', x:'x' }[s];
  if (s === 'date') arr.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  else arr.sort((a,b) => (b[key]||0) - (a[key]||0));
  return arr;
}

let dragRec = null;

function renderTabs() {
  const pool = basePool();
  const counts = { 'All': pool.length };
  STATUSES.forEach(s => counts[s] = pool.filter(d => d.status === s).length);
  $('tabs').innerHTML = '';
  ['All', ...STATUSES].forEach(name => {
    const el = document.createElement('div');
    el.className = 'tab' + (curTab === name ? ' on' : '') + (name !== 'All' ? ' droppable' : '');
    el.innerHTML = esc(name) + ' <span class="cnt">' + counts[name] + '</span>';
    el.onclick = () => { curTab = name; shown = PAGE; render(); };
    if (name !== 'All') {
      el.ondragover = e => { if (dragRec) { e.preventDefault(); el.classList.add('over'); } };
      el.ondragleave = () => el.classList.remove('over');
      el.ondrop = e => {
        e.preventDefault(); el.classList.remove('over');
        const d = byRec[dragRec]; dragRec = null;
        if (d && d.status !== name) setStatus(d, name);
      };
    }
    $('tabs').appendChild(el);
  });
}

const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const el = e.target, pid = el.dataset.pid;
      if (!el.querySelector('iframe')) {
        const f = document.createElement('iframe');
        f.src = 'https://www.instagram.com/p/' + pid + '/embed/';
        f.loading = 'lazy'; f.allow = 'autoplay; encrypted-media';
        el.appendChild(f);
      }
      io.unobserve(el);
    }
  });
}, { rootMargin: '400px' });

async function setStatus(d, val) {
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?post_id=eq.' + encodeURIComponent(d.id), {
      method: 'PATCH',
      headers: { 'apikey': ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: val })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d.status = val;
    cacheStatus(d.id, val);
    toast('✓ @' + d.competitor + ' moved to "' + val + '"', true);
  } catch (e) {
    toast('Update failed: ' + e.message + (String(e.message).includes('401') || String(e.message).includes('403') ? ' — invalid key?' : ''), false);
  }
  render();
}

function card(d, idx) {
  const el = document.createElement('div');
  el.className = 'card' + ((d.x || 0) >= 2 ? ' outlier' : '');
  el.style.animationDelay = Math.min(idx % PAGE, 14) * 30 + 'ms';
  el.draggable = true;
  el.ondragstart = e => {
    dragRec = d.id;
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('lifting');
    document.body.classList.add('dragging');
  };
  el.ondragend = () => {
    el.classList.remove('lifting');
    document.body.classList.remove('dragging');
    dragRec = null;
  };
  const typeIcon = d.video ? 'video' : (d.type === 'Carousel' ? 'layers' : 'image');
  const days = d.days, horse = d.horse;
  const ago = days === null ? '' : (days === 0 ? 'today' : days + 'd ago');
  const lines = (d.caption || '').split('\n').map(l => l.trim()).filter(Boolean);
  const hook = lines[0] || '';
  const tr = (d.transcript && d.transcript !== '(transcription failed)' && d.transcript !== '(no speech)') ? d.transcript : '';
  el.innerHTML = `
    <div class="embed" data-pid="${d.id}"><div class="ph"><svg class="ic"><use href="#i-${typeIcon}"/></svg></div></div>
    <div class="meta">
      <div class="row1">
        <span class="handle" title="Drag onto a tab above to file it">${I('grip')}</span>
        <a class="who" href="https://www.instagram.com/${d.competitor}/" target="_blank">@${d.competitor}</a>
        <span class="badge">${d.type || '-'}</span>
        ${days !== null && days <= 7 ? '<span class="badge bnew">' + I('star') + 'New post</span>' : ''}
        ${horse ? '<span class="badge bhorse">' + I('zap') + 'Dark horse</span>' : ''}
        ${d.bait ? '<span class="badge bbait" title="&quot;Comment XX&quot; bait tactic — comments are inflated by the giveaway; the funnel is worth studying">' + I('magnet') + 'Bait</span>' : ''}
        <span class="date" title="${d.date || ''}">${ago}</span>
      </div>
      <div class="nums">
        <span class="num hot" title="Viral Score">${I('flame')}<b>${d.score}</b></span>
        ${(d.x || 0) >= 2 ? '<span class="num x" title="How many times this account’s own average">' + I('trend') + '<b>×' + d.x + '</b></span>' : ''}
        <span class="num er" title="Engagement Rate">${I('pct')}<b>${d.er}%</b></span>
        <span class="num" title="Likes">${I('heart')}<b>${d.likes > 0 ? fmt(d.likes) : 'hidden'}</b></span>
        <span class="num" title="Comments">${I('msg')}<b>${fmt(d.comments)}</b></span>
        <span class="num" title="Followers">${I('users')}<b>${fmt(d.followers)}</b></span>
      </div>
      <div class="cap" onclick="this.classList.toggle('open')"></div>
      ${d.brk ? '<div class="ai" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      ${d.my ? '<div class="mine" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      <div class="srow"><label>Status</label><select class="status btn s${d.status}"></select>
        <button class="abtn copy" title="Copy full caption">${I('copy')}Caption</button>
        ${tr ? '<button class="abtn mic" title="Copy the video transcript">' + I('mic') + 'Transcript</button>' : ''}
        ${d.my ? '<button class="abtn minec" title="Copy my rewritten script (ready to film)">' + I('mic') + 'My Script</button>' : ''}
        <button class="abtn brief" title="Copy filming brief (stats + hook + AI breakdown + my script + transcript + caption)">${I('clip')}Brief</button>
        <a class="abtn" href="${d.url}" target="_blank" title="Open the original Instagram post">${I('ext')}</a></div>
    </div>`;
  const capEl = el.querySelector('.cap');
  const restTxt = lines.slice(1).join('\n');
  capEl.innerHTML = hook ? '<b>' + esc(hook) + '</b>' + (restTxt ? '<br>' + esc(restTxt).replace(/\n/g, '<br>') : '') : '';
  const aiEl = el.querySelector('.ai');
  if (aiEl) aiEl.innerHTML = '<b>💡 AI Breakdown</b><br>' + esc(d.brk).split(String.fromCharCode(10)).join('<br>');
  const myEl = el.querySelector('.mine');
  if (myEl) myEl.innerHTML = '<b>🎬 My Version (ready to film)</b><br>' + esc(d.my).split(String.fromCharCode(10)).join('<br>');
  const sel = el.querySelector('.status');
  STATUSES.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
  sel.value = d.status;
  sel.onchange = () => setStatus(d, sel.value);
  el.querySelector('.copy').onclick = () =>
    navigator.clipboard.writeText(d.caption || '').then(() => toast('✓ Caption copied', true));
  const micBtn = el.querySelector('.mic');
  if (micBtn) micBtn.onclick = () =>
    navigator.clipboard.writeText(tr).then(() => toast('✓ Transcript copied', true));
  const mineBtn = el.querySelector('.minec');
  if (mineBtn) mineBtn.onclick = () =>
    navigator.clipboard.writeText(d.my).then(() => toast('✓ My script copied', true));
  el.querySelector('.brief').onclick = () => {
    const NL = String.fromCharCode(10);
    const parts = ['🎬 Viral reference @' + d.competitor + ((d.x || 0) >= 2 ? ' (own average ×' + d.x + ')' : ''),
      '📊 🔥' + d.score + ' | ER ' + d.er + '% | ❤️ ' + (d.likes > 0 ? fmt(d.likes) : 'hidden') +
      ' | 💬 ' + fmt(d.comments) + ' | 👥 ' + fmt(d.followers) + (ago ? ' | ' + ago : ''),
      '🔗 ' + d.url, '✍️ Hook: ' + hook];
    if (d.brk) parts.push('——— AI Breakdown ———', d.brk);
    if (d.my) parts.push('——— My Version (ready to film) ———', d.my);
    if (tr) parts.push('——— Competitor transcript ———', tr);
    parts.push('——— Full caption ———', d.caption || '');
    navigator.clipboard.writeText(parts.join(NL)).then(() => toast('✓ Brief copied, ready to send to filming/editing', true));
  };
  io.observe(el.querySelector('.embed'));
  return el;
}

function render() {
  renderTabs();
  const arr = filtered();
  const grid = $('grid'); grid.innerHTML = '';
  arr.slice(0, shown).forEach((d, i) => grid.appendChild(card(d, i)));
  $('empty').style.display = arr.length ? 'none' : '';
  $('moreWrap').style.display = arr.length > shown ? '' : 'none';
}


function applyStatusCache() {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache_en') || '{}');
    Object.keys(c).forEach(rid => { const d = byRec[rid]; if (d) d.status = c[rid]; });
  } catch (e) {}
}

function cacheStatus(rid, val) {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache_en') || '{}');
    c[rid] = val; localStorage.setItem('st_cache_en', JSON.stringify(c));
  } catch (e) {}
}

// live status refresh (so weekly-baked page shows current statuses)
async function refreshStatuses() {
  applyStatusCache(); render();  // last-known statuses first
  if (Date.now() - (+localStorage.getItem('st_ts_en') || 0) < 600000) return;  // 10-min throttle
  localStorage.setItem('st_ts_en', String(Date.now()));
  const fresh = {};
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?select=post_id,status', { headers: { 'apikey': ANON } });
    if (!r.ok) return;
    (await r.json()).forEach(row => {
      const d = byRec[row.post_id];
      if (d) d.status = row.status || 'New';
      if (row.status && row.status !== 'New') fresh[row.post_id] = row.status;
    });
    localStorage.setItem('st_cache_en', JSON.stringify(fresh));
    render();
  } catch (e) {}
}

['fTracker','fComp','fSort'].forEach(id => $(id).onchange = () => { shown = PAGE; render(); });
$('fSearch').oninput = () => { shown = PAGE; render(); };
$('fVideo').onclick = () => { videoOnly = !videoOnly; $('fVideo').classList.toggle('on', videoOnly); shown = PAGE; render(); };
$('moreBtn').onclick = () => { shown += PAGE; render(); };

// preset quick filters
$('presets').innerHTML = '<span class="lbl">Quick filters</span>';
PRESETS.forEach(p => {
  const c = document.createElement('span'); c.className = 'chip2';
  c.innerHTML = I(p.icon) + esc(p.label);
  c.onclick = () => { presetOn[p.k] = !presetOn[p.k]; c.classList.toggle('on', presetOn[p.k]); shown = PAGE; render(); };
  $('presets').appendChild(c);
});

// trending hashtags among outlier posts
if (TRENDS.length) {
  $('trends').innerHTML = '<span class="lbl">Trending tags</span>';
  TRENDS.forEach(([tag, n]) => {
    const c = document.createElement('span'); c.className = 'chip2';
    c.textContent = '#' + tag + ' ' + n;
    c.onclick = () => { $('fSearch').value = $('fSearch').value === tag ? '' : tag; shown = PAGE; render(); };
    $('trends').appendChild(c);
  });
} else { $('trends').style.display = 'none'; }

render();
refreshStatuses();
</script>
</body>
</html>
